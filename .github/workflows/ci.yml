name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies
        run: pip install -q numpy scipy
      - name: Verify declared entrypoint
        run: |
          python -m py_compile src/fit_hours.py
          python src/fit_hours.py
